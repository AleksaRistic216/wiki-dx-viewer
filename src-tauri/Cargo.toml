[package]
name = "wiki-dx-viewer"
version = "0.1.13"
description = "Desktop app for browsing DevExpress wiki content with AI chat"
authors = ["DevExpress"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
