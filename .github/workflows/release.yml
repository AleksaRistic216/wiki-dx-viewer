name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          version=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          current="${{ steps.current.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$current"
          new_patch=$((patch + 1))
          new_version="${major}.${minor}.${new_patch}"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT
          echo "Bumping version: $current -> $new_version"

      - name: Update version in files
        run: |
          new_version="${{ steps.bump.outputs.version }}"
          # Update tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$new_version\"/" src-tauri/tauri.conf.json
          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$new_version\"/" src-tauri/Cargo.toml
          # Update package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$new_version\"/" src/package.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes to commit"
          git push

      - name: Create tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            node_archive: node-v20.18.1-linux-x64.tar.xz
            node_binary: node-v20.18.1-linux-x64/bin/node
            node_dest: resources/node/bin/node
          - platform: macos-latest
            target: macos
            node_archive: node-v20.18.1-darwin-arm64.tar.gz
            node_binary: node-v20.18.1-darwin-arm64/bin/node
            node_dest: resources/node/bin/node
          - platform: windows-latest
            target: windows
            node_archive: node-v20.18.1-win-x64.zip
            node_binary: node-v20.18.1-win-x64/node.exe
            node_dest: resources/node/node.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js (for building)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Next.js
        run: |
          cd src
          npm ci
          npm run build

      - name: Prepare resources directory
        shell: bash
        run: |
          mkdir -p src-tauri/resources/node
          mkdir -p src-tauri/resources/server

      - name: Download portable Node.js
        shell: bash
        run: |
          cd src-tauri
          NODE_URL="https://nodejs.org/dist/v20.18.1/${{ matrix.node_archive }}"
          echo "Downloading $NODE_URL"
          curl -sL "$NODE_URL" -o node_archive

          if [[ "${{ matrix.target }}" == "windows" ]]; then
            unzip -q node_archive -d node_tmp
          elif [[ "${{ matrix.node_archive }}" == *.tar.xz ]]; then
            mkdir node_tmp && tar -xJf node_archive -C node_tmp
          else
            mkdir node_tmp && tar -xzf node_archive -C node_tmp
          fi

          # Create destination directory structure
          dest_dir=$(dirname "${{ matrix.node_dest }}")
          mkdir -p "$dest_dir"
          cp "node_tmp/${{ matrix.node_binary }}" "${{ matrix.node_dest }}"
          chmod +x "${{ matrix.node_dest }}" 2>/dev/null || true

          rm -rf node_archive node_tmp

      - name: Copy standalone server to resources
        shell: bash
        run: |
          cp -r src/.next/standalone/* src-tauri/resources/server/
          if [ -d "src/.next/static" ]; then
            mkdir -p src-tauri/resources/server/.next/static
            cp -r src/.next/static/* src-tauri/resources/server/.next/static/
          fi
          if [ -d "src/public" ]; then
            mkdir -p src-tauri/resources/server/public
            cp -r src/public/* src-tauri/resources/server/public/
          fi

      - name: Generate icons (if missing)
        shell: bash
        run: |
          cd src-tauri
          if [ ! -f "icons/icon.ico" ]; then
            python3 -c "
          import struct, zlib, os
          os.makedirs('icons', exist_ok=True)
          def create_png(size):
              width = height = size
              raw = b''
              for y in range(height):
                  raw += b'\x00'
                  for x in range(width):
                      raw += b'\x1a\x6b\xaa\xff'
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          for size, name in [(32,'32x32.png'),(128,'128x128.png'),(256,'128x128@2x.png')]:
              open(f'icons/{name}', 'wb').write(create_png(size))
          png32 = create_png(32)
          ico_header = struct.pack('<HHH', 0, 1, 1)
          ico_entry = struct.pack('<BBBBHHII', 32, 32, 0, 0, 1, 32, len(png32), 22)
          open('icons/icon.ico', 'wb').write(ico_header + ico_entry + png32)
          open('icons/icon.icns', 'wb').write(create_png(128))
          print('Icons generated')
          "
          fi

      - name: Build Tauri
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"resources":["resources/**/*"]}}'
        run: |
          cd src-tauri
          npx tauri build

      - name: Upload artifacts (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Wiki DX Viewer ${{ needs.version.outputs.version }}
          body: |
            ## Wiki DX Viewer ${{ needs.version.outputs.version }}

            ### Prerequisites
            - [Git](https://git-scm.com/downloads)
            - [GitHub CLI](https://cli.github.com/) (authenticated via `gh auth login`)

            ### Downloads
            - **Windows**: `.msi` or `.exe` installer
            - **macOS**: `.dmg` disk image
            - **Linux**: `.deb` package or `.AppImage`
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
